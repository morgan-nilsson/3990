<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h2 {
            color: brown;
            background: rgba(200, 100, 100, 0.2);
            padding: 10px;
        }
        #gen {
            text-align: center;
            background: rgba(200, 100, 100, 0.3);
            padding: 15px;
        }
        #gen .num {
            display: inline-block;
            background: darkred;
            color: white;
            padding: 5px 20px;
            font-size: 18px;
            min-width: 30px;
        }
        #gen button {
            font-size: 18px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .news-item {
            background: rgba(200, 100, 100, 0.3);
            padding: 10px;
            margin: 5px 0;
            text-align: center;
        }
        .news-item h3 {
            margin: 5px 0;
        }
        .news-item p {
            margin: 5px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="gen"></div>
    <div id="news"></div>
    <script src="Main.js" type="module"></script>
</body>
</html>
