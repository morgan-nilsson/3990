<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h2 {
            margin-bottom: 15px;
        }
        .color-btn {
            padding: 5px 15px;
            color: white;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
            margin-right: 3px;
        }
        #fruits ul {
            list-style: disc;
            padding-left: 20px;
        }
        #fruits li {
            padding: 8px 10px;
            margin: 8px 0;
            font-size: 16px;
        }
        .star {
            font-size: 24px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s;
        }
        .star:hover {
            transform: scale(1.3);
        }
        .star.on {
            color: orange;
        }
        .star.off {
            color: #ccc;
        }
        .star-rating {
            background-color: #f0e6d3;
            display: block;
            padding: 5px 10px;
            margin-top: 5px;
            border-radius: 4px;
            width: fit-content;
        }
    </style>
</head>
<body>
    <div id="colors">
        <h2>Select color</h2>
    </div>

    <div id="fruits">
        <ul>Fruits:</ul>
    </div>

    <script src="Main.js" type="module"></script>
</body>
</html>
